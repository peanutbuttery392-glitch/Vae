vedit:el=>{const x=S.vision.find(a=>a.id===el.dataset.id);form('Edit vision',[{k:'title',l:'Title',v:x.title},{k:'cat',l:'Category',t:'sel',o:['Love','Career','Wealth','Health','Travel','Home','Growth'],v:x.cat},{k:'img',l:'Image',t:'img',v:x.img},{k:'desc',l:'Affirmation / description',t:'area',v:x.desc}],(v,im)=>{if(v.title){Object.assign(x,{title:v.title,cat:v.cat,desc:v.desc,img:im.img||v.img||''})}})},
dedit:el=>{const x=S.diary.find(a=>a.id===el.dataset.id);form('Edit diary entry',[{k:'date',l:'Date',t:'date',v:x.date},{k:'mood',l:'Mood',t:'sel',o:['😊 happy','🥰 loved','😌 calm','🤩 excited','😴 tired','😔 sad','🌧 heavy'],v:x.mood},{k:'title',l:'Headline',v:x.title},{k:'story',l:'Story',t:'area',v:x.story},{k:'img',l:'Photo',t:'img',v:x.img}],(v,im)=>{Object.assign(x,{date:v.date||x.date,mood:v.mood,title:v.title||'Untitled',story:v.story,img:im.img||v.img||''})})},
trn:el=>{const n=nodeOf(el.dataset.k,el.dataset.id);form('Rename '+n.type,[{k:'name',l:'Name',v:n.name}],v=>{if(v.name)n.name=v.name})},
topen:el=>{(ui.path[el.dataset.k]=ui.path[el.dataset.k]||[]).push(el.dataset.id);render()},
tcr:el=>{ui.path[el.dataset.k]=(ui.path[el.dataset.k]||[]).slice(0,+el.dataset.i);render()},
tadd:el=>{const k=el.dataset.k,ty=el.dataset.v;form('New '+ty,[{k:'name',l:'Name'}],v=>{if(v.name)walk(k).arr.push(ty==='folder'?{id:uid(),type:'folder',name:v.name,children:[]}:{id:uid(),type:'file',name:v.name,note:'',steps:[],subs:[],photo:''})})},
tdel:el=>{if(confirm('Delete this item?')){const a=walk(el.dataset.k).arr,i=a.findIndex(x=>x.id===el.dataset.id);a.splice(i,1);save();render()}},
fmt:el=>{document.execCommand(el.dataset.v,false,el.dataset.v==='formatBlock'?'h3':null)},
sadd:el=>{const k=el.dataset.k,i=document.querySelector('[data-newstep]');if(!i.value.trim())return;walk(k).file.steps.push({id:uid(),t:i.value.trim(),d:false});save();render()},
stog:el=>{const s=walk(el.dataset.k).file.steps.find(x=>x.id===el.dataset.id);s.d=!s.d;save();render()},
sdel:el=>{const f=walk(el.dataset.k).file;f.steps=f.steps.filter(x=>x.id!==el.dataset.id);save();render()},
fphoto:el=>pick(d=>{walk(el.dataset.k).file.photo=d;save();render()}),fphoto0:el=>{walk(el.dataset.k).file.photo='';save();render()},
subadd:el=>{walk(el.dataset.k).file.subs.push({id:uid(),t:'New sub-item',d:''});save();render()},
subdel:el=>{const f=walk(el.dataset.k).file;f.subs=f.subs.filter(x=>x.id!==el.dataset.id);save();render()},
fimg:el=>pick(d=>{FM.imgs[el.dataset.k]=d;const i=document.querySelector('#mbox [name="'+el.dataset.k+'"]');if(i)i.value='';$('#u_'+el.dataset.k).textContent='✓ image uploaded'}),
fok:()=>{const v={};document.querySelectorAll('#mbox [name]').forEach(i=>v[i.name]=i.value.trim());const f=FM;f.fields.forEach(x=>{if(x.t==='img'&&v[x.k])delete f.imgs[x.k]});f.ok(v,f.imgs);save();close();render()},
icon:el=>{S.icon=el.dataset.id;save();render();custom()},iconup:()=>pick(d=>{S.iconImg=d;S.icon='img';save();render();custom()},128),
theme:el=>{S.theme=el.dataset.id;S.accent='';save();render();custom()},accent0:()=>{S.accent='';save();render();custom()},
font:el=>{S.font=el.dataset.id;save();render();custom()},rad:el=>{S.radius=el.dataset.id;save();render();custom()},
banner:()=>pick(d=>{S.banner=d;save();render();custom()},1400),banner0:()=>{S.banner='';save();render();custom()},
wid:el=>{S.widgets[el.dataset.id]=S.widgets[el.dataset.id]?0:1;save();render();custom()},
tup:el=>mv(el.dataset.id,-1),tdn:el=>mv(el.dataset.id,1),
thide:el=>{const t=S.tabs.find(x=>x.id===el.dataset.id);t.hidden=!t.hidden;save();render();custom()},
tabdel:el=>{if(confirm('Delete this tab and everything in it?')){S.tabs=S.tabs.filter(x=>x.id!==el.dataset.id);delete S.trees[el.dataset.id];save();render();custom()}},
tabadd:()=>form('New tab',[{k:'name',l:'Tab name'},{k:'emoji',l:'Icon',t:'sel',o:['folder','heart','star','leaf','moon','sun','flower','cloud','coffee','camera','music','bookmark'],v:'folder'}],v=>{if(v.name){const id='c'+uid();S.tabs.push({id,name:v.name,emoji:v.emoji||'folder',hidden:false,custom:true});S.trees[id]=[];ui.tab=id}}),
export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`${(S.name||'vae').replace(/\W+/g,'-')}-backup-${td()}.json`;a.click()},
import:()=>{const r=$('#rf');r.onchange=()=>{const f=r.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;S={...D(),...o,widgets:{...D().widgets,...(o.widgets||{})}};save();render();close();toast('Backup restored 🌸')}catch(x){toast('That file is not a valid backup')}};rd.readAsText(f)};r.click()}
};
function mv(id,d){const i=S.tabs.findIndex(t=>t.id===id),j=i+d;if(j<0||j>=S.tabs.length)return;[S.tabs[i],S.tabs[j]]=[S.tabs[j],S.tabs[i]];save();render();custom()}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(el&&A[el.dataset.a]&&!(el.type==='checkbox'&&ev.detail===0&&false)){if(el.tagName==='A')return;A[el.dataset.a](el)}else if(ev.target.id==='modal')close()});
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
if(d.set){S[d.set]=t.value;save();theme();render_light()}
else if(d.emoji!==undefined&&t.value.trim()){S.icon=t.value.trim();save();render()}
else if(d.tn){const x=S.tabs.find(a=>a.id===d.tn);x.name=t.value||x.name;save();render()}
else if(d.ci!==undefined){S.checkin[td()]=t.value;save()}
else if(d.q!==undefined){ui.q=t.value;const p=t.selectionStart;render();const n=$('[data-q]');n.focus();n.setSelectionRange(p,p)}
else if(d.note!==undefined){walk(d.k).file.note=clean(t.innerHTML);save()}});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.fname!==undefined){walk(d.k).file.name=t.value||'Untitled';save();render()}
else if(d.sub){const s=walk(d.k).file.subs.find(x=>x.id===d.id);s[d.sub]=t.value;save()}});
function render_light(){render()}
let dip=null;addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();dip=ev});
function install(){document.body.classList.remove('dr');if(dip){dip.prompt();dip=null;return}modal(`<h3 class="fh text-2xl font-semibold mb-3">Add to home screen</h3><p class="text-sm mb-2"><b>iPhone / iPad (Safari):</b> tap Share, then “Add to Home Screen”.</p><p class="text-sm mb-2"><b>Android (Chrome):</b> tap the ⋮ menu, then “Install app” or “Add to Home screen”.</p><p class="text-xs" style="color:var(--mut)">Open this from your own hosted link for the full offline app. Your data stays on the device you install it on, so use Backup to move it.</p><div class="text-right mt-4"><button class="btn" data-a="close">Got it</button></div>`)}
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
